<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屋企 Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9f43;
            --bus-mtr: #5d2b8b;
            --bus-kmb: #d63031;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        #clock { font-size: 3rem; font-weight: bold; color: var(--accent-color); }
        #date { font-size: 1.2rem; color: #aaa; }
        h2 { margin-top: 0; font-size: 1.5rem; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .bus-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
        }
        .mtr { background-color: var(--bus-mtr); }
        .kmb { background-color: var(--bus-kmb); }
        .eta-time { font-size: 1.3rem; font-weight: bold; color: #2ecc71; }
        .eta-next { font-size: 0.95rem; color: #aaa; margin-left: 10px; }

        .schedule-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: #2d2d2d;
            padding: 12px;
            border-radius: 8px;
        }
        .schedule-time {
            width: 70px;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
        }
        .schedule-text { flex-grow: 1; font-size: 1.1rem; }
        
        .admin-panel {
            grid-column: 1 / -1;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px dashed #555;
        }
        .admin-panel input {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 8px; border-radius: 5px; margin-right: 10px;
        }
        .admin-panel button {
            background: var(--accent-color); border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .delete-btn {
            background: #ff4d4d; border: none; color: white; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 頂部時間 -->
    <div class="header-section">
        <div>
            <div id="clock">--:--:--</div>
            <div id="date">日曆載入中...</div>
        </div>
        <div style="font-size: 1.5rem;">🏠 屋企儀表板</div>
    </div>

    <!-- 巴士實時到站 -->
    <div class="card">
        <h2>🚌 樓下巴士到站時間</h2>
        <div id="bus-container">
            <div class="bus-item">正在獲取最新巴士到站數據...</div>
        </div>
    </div>

    <!-- 個人行程表 -->
    <div class="card">
        <h2>📅 今日行程 / 備忘錄</h2>
        <div id="schedule-container"></div>
    </div>

    <!-- 行程輸入後台 -->
    <div class="admin-panel">
        <h3 style="margin-top:0; color: #aaa;">✏️ 新增今日行程</h3>
        <input type="text" id="new-time" placeholder="時間 (e.g. 08:30)" style="width: 120px;">
        <input type="text" id="new-text" placeholder="行程內容" style="width: 300px;">
        <button onclick="addSchedule()">新增項目</button>
    </div>
</div>

<script>
    // ======= 核心 1: 即時時鐘與日期（最優先，與 API 完全無關） =======
    function startClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', options);
        document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
    }
    setInterval(startClock, 1000);
    startClock();

    // ======= 核心 2: 行程輸入儲存系統（即開即用） =======
    let mySchedules = JSON.parse(localStorage.getItem('home_schedules')) || [
        { time: '08:15', text: '睇 K68 巴士時間準備出門' },
        { time: '12:30', text: '出元朗市中心食晏晝飯' }
    ];

    function displaySchedules() {
        const container = document.getElementById('schedule-container');
        if(!container) return;
        container.innerHTML = '';
        mySchedules.sort((a, b) => a.time.localeCompare(b.time));

        if (mySchedules.length === 0) {
            container.innerHTML = '<div style="color:#666; padding: 10px;">目前沒有行程，請在下方輸入。</div>';
            return;
        }

        mySchedules.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            div.innerHTML = `
                <div class="schedule-time">${item.time}</div>
                <div class="schedule-text">${item.text}</div>
                <button class="delete-btn" onclick="deleteSchedule(${index})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function addSchedule() {
        const timeInput = document.getElementById('new-time');
        const textInput = document.getElementById('new-text');
        if (!timeInput || !textInput || !timeInput.value || !textInput.value) return alert('請填寫時間和內容！');

        mySchedules.push({ time: timeInput.value, text: textInput.value });
        localStorage.setItem('home_schedules', JSON.stringify(mySchedules));
        timeInput.value = ''; 
        textInput.value = '';
        displaySchedules();
    }

    function deleteSchedule(index) {
        mySchedules.splice(index, 1);
        localStorage.setItem('home_schedules', JSON.stringify(mySchedules));
        displaySchedules();
    }
    displaySchedules();

    // ======= 核心 3: 異步巴士 API 獲取（加載失敗隔離區） =======
    async function fetchAllBusETA() {
        const container = document.getElementById('bus-container');
        if(!container) return;
        container.innerHTML = ''; 

        // 獨立嘗試獲取港鐵巴士 K68
        try {
            const mtrUrl = 'https://data.gov.hk';
            const mtrResponse = await fetch(mtrUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ routeName: 'K68', language: 'zh' })
            });
            const mtrData = await mtrResponse.json();
            
            let txt1 = "暫無班次", txt2 = "";
            if (mtrData && mtrData.busStopList) {
                const stop = mtrData.busStopList.find(s => s.busStopId === 'K68-U150');
                if (stop && stop.busList && stop.busList.length > 0) {
                    let min1 = Math.max(0, Math.round(parseInt(stop.busList[0].arrivalTimeInSecond || 0) / 60));
                    txt1 = min1 === 0 ? "即將到站" : `${min1} 分鐘`;
                    if (stop.busList[1]) {
                        let min2 = Math.max(0, Math.round(parseInt(stop.busList[1].arrivalTimeInSecond || 0) / 60));
                        txt2 = `下班: ${min2}分`;
                    }
                }
            }
            renderBusItem(container, 'K68', '南元朗官立小學', txt1, txt2, 'mtr');
        } catch (e) {
            console.error("MTR API Error:", e);
            renderBusItem(container, 'K68', '南元朗官立小學', '❌ 無法連線港鐵', '', 'mtr');
        }

        // 獨立嘗試獲取九巴 68F
        try {
            const kmbUrl = 'https://etabus.gov.hk';
            const kmbResponse = await fetch(kmbUrl);
            const kmbData = await kmbResponse.json();
            
            let txt1 = "暫無班次", txt2 = "";
            if (kmbData && kmbData.data) {
                let lines = kmbData.data.filter(item => item.route === '68F');
                if (lines && lines.length > 0) {
                    const now = new Date();
                    if (lines[0] && lines[0].eta) {
                        let min1 = Math.max(0, Math.round((new Date(lines[0].eta) - now) / 60000));
                        txt1 = min1 === 0 ? "即將到站" : `${min1} 分鐘`;
                    }
                    if (lines[1] && lines[1].eta) {
                        let min2 = Math.max(0, Math.round((new Date(lines[1].eta) - now) / 60000));
                        txt2 = `下班: ${min2}分`;
                    }
                }
            }
            renderBusItem(container, '68F', '翹翠峰 (第2個)', txt1, txt2, 'kmb');
        } catch (e) {
            console.error("KMB API Error:", e);
            renderBusItem(container, '68F', '翹翠峰 (第2個)', '❌ 無法連線九巴', '', 'kmb');
        }
    }

    function renderBusItem(container, route, stopName, eta, nextEta, companyClass) {
        const div = document.createElement('div');
        div.className = 'bus-item';
        div.innerHTML = `
            <div>
                <span class="bus-badge ${companyClass}">${route}</span>
                <span style="margin-left:10px; color:#ccc;">${stopName}</span>
